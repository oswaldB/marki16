<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activités récentes — Marki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/2/assets/css/shared.css">
  <script>
    Parse.initialize('adti-marki', 'c8d7e205725c6a06dfb3771a2f739fe861664fc6ef90fbda');
    Parse.serverURL = 'https://adti.markidiags.com/api/parse';
  </script>
  <style>
    .force-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .force-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  </style>
  <script type="module" src="/2/assets/js/components/sidebar.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <marki-sidebar></marki-sidebar>
  <div id="app" x-data="activitesPage" x-cloak class="min-h-screen md:pl-64 pb-16 md:pb-0">
    <main class="min-h-screen">
      <div class="p-6 space-y-4">

        <!-- ═══ Header ═══ -->
        <h1 class="text-2xl font-bold text-gray-900">Activités récentes</h1>

        <!-- ═══ Filtres ═══ -->
        <div class="flex items-center gap-4 flex-wrap">
          <select x-model="filterType" class="w-48 text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
            <template x-for="opt in typeOptions" :key="opt.value">
              <option :value="opt.value" x-text="opt.label"></option>
            </template>
          </select>
          <select x-model="filterOperation" class="w-48 text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
            <template x-for="opt in operationOptions" :key="opt.value">
              <option :value="opt.value" x-text="opt.label"></option>
            </template>
          </select>
          <div class="relative w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" x-model="searchNfacture" placeholder="Rechercher par n° facture…" class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white" />
          </div>
        </div>

        <!-- ═══ Onglets ═══ -->
        <div class="flex rounded-lg border border-gray-200 bg-gray-50 p-1 gap-1">
          <template x-for="tab in viewTabs" :key="tab.key">
            <button class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors"
              :class="selectedView === tab.key ? 'bg-white text-sky-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
              @click="selectedView = tab.key"
              x-text="tab.label">
            </button>
          </template>
        </div>

        <!-- ═══ Loading ═══ -->
        <div x-show="loading" class="text-center py-12 text-gray-400">
          <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Chargement…
        </div>

        <!-- ═══ Empty state ═══ -->
        <div x-show="!loading && filteredActivites.length === 0" class="text-center py-12 text-gray-400">
          <i class="fa-regular fa-inbox text-4xl mb-3 block"></i>
          Aucune activité trouvée
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═══ Vue détaillée ═══ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div x-show="!loading && selectedView === 'detailed' && filteredActivites.length > 0" class="border border-gray-200 rounded-lg overflow-hidden bg-white">
          <div class="overflow-x-auto force-scrollbar max-h-[60vh]">
            <table class="w-full text-sm text-left">
              <thead class="bg-gray-50 sticky top-0 z-10">
                <tr class="border-b border-gray-200">
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Date / Heure</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Type</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Opération</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">N° Facture</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Montant</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Payeur</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Déclencheur</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Erreur</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in filteredActivites" :key="row.objectId">
                  <tr class="border-b border-gray-100 hover:bg-gray-50" :class="row.operation === 'error' ? 'bg-red-50' : ''">
                    <td class="p-3 whitespace-nowrap" x-text="formatDateTime(row.timestamp)"></td>
                    <td class="p-3 whitespace-nowrap">
                      <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium" :class="badgeClasses(typeColor(row.type))" x-text="typeLabel(row.type)"></span>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                      <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium" :class="badgeClasses(operationColor(row.operation))" x-text="operationLabel(row.operation)"></span>
                    </td>
                    <td class="p-3 whitespace-nowrap font-mono">
                      <a x-show="row.impaye_id" :href="'../impayes-detail/index.html?id=' + row.impaye_id" class="text-blue-600 hover:text-blue-800" x-text="row.nfacture || '—'"></a>
                      <span x-show="!row.impaye_id" x-text="row.nfacture || '—'"></span>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                      <span x-show="row.montant !== null &amp;&amp; row.montant !== undefined" x-text="formatCurrency(row.montant)"></span>
                      <span x-show="row.montant === null || row.montant === undefined" class="text-gray-400">—</span>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                      <span x-show="row.payeur_nom" x-text="row.payeur_nom"></span>
                      <span x-show="!row.payeur_nom" class="text-gray-400">—</span>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                      <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium" :class="row.trigger === 'manual' ? badgeClasses('blue') : badgeClasses('gray')">
                        <span x-text="row.trigger === 'manual' ? 'Manuel' : 'Automatique'"></span>
                      </span>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                      <span x-show="row.error_message" class="text-red-600 text-sm" x-text="row.error_message"></span>
                      <span x-show="!row.error_message" class="text-gray-400">—</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═══ Vue groupée par date/heure ═══ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div x-show="!loading && selectedView === 'grouped_datetime' && filteredActivites.length > 0" class="border border-gray-200 rounded-lg overflow-hidden bg-white">
          <div class="overflow-x-auto force-scrollbar max-h-[60vh]">
            <table class="w-full text-sm text-left">
              <thead class="bg-gray-50 sticky top-0 z-10">
                <tr class="border-b border-gray-200">
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700 w-40">Date</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Activités</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="group in groupedByDateTime" :key="group.date">
                  <tr class="border-b border-gray-100">
                    <td class="p-3 align-top whitespace-nowrap">
                      <span class="font-semibold text-gray-900" x-text="group.date"></span>
                    </td>
                    <td class="p-3">
                      <div class="space-y-2">
                        <template x-for="activity in group.activities" :key="activity.objectId">
                          <div class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg flex-wrap">
                            <span class="text-sm text-gray-500 whitespace-nowrap" x-text="formatTime(activity.timestamp)"></span>
                            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" :class="badgeClasses(typeColor(activity.type))" x-text="typeLabel(activity.type)"></span>
                            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" :class="badgeClasses(operationColor(activity.operation))" x-text="operationLabel(activity.operation)"></span>
                            <span class="font-mono text-sm" x-text="activity.nfacture || '—'"></span>
                            <span x-show="activity.payeur_nom" class="text-sm truncate max-w-[150px]" x-text="activity.payeur_nom"></span>
                          </div>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═══ Vue groupée par type ═══ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div x-show="!loading && selectedView === 'grouped_type' && filteredActivites.length > 0" class="border border-gray-200 rounded-lg overflow-hidden bg-white">
          <div class="overflow-x-auto force-scrollbar max-h-[60vh]">
            <table class="w-full text-sm text-left">
              <thead class="bg-gray-50 sticky top-0 z-10">
                <tr class="border-b border-gray-200">
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Type</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Activités</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="group in groupedByType" :key="group.type">
                  <tr class="border-b border-gray-100">
                    <td class="p-3 align-top whitespace-nowrap">
                      <div class="flex items-center gap-2">
                        <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium" :class="badgeClasses(typeColor(group.type))" x-text="typeLabel(group.type)"></span>
                        <span class="text-gray-500 text-sm">(<span x-text="group.count"></span> activités)</span>
                      </div>
                    </td>
                    <td class="p-3">
                      <div class="space-y-2">
                        <template x-for="activity in group.activities" :key="activity.objectId">
                          <div class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg flex-wrap">
                            <span class="text-sm text-gray-500 whitespace-nowrap" x-text="formatDateTime(activity.timestamp)"></span>
                            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" :class="badgeClasses(operationColor(activity.operation))" x-text="operationLabel(activity.operation)"></span>
                            <span class="font-mono text-sm" x-text="activity.nfacture || '—'"></span>
                            <span x-show="activity.payeur_nom" class="text-sm truncate max-w-[150px]" x-text="activity.payeur_nom"></span>
                          </div>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- ═══ Vue groupée par opération ═══ -->
        <!-- ═══════════════════════════════════════════════ -->
        <div x-show="!loading && selectedView === 'grouped_operation' && filteredActivites.length > 0" class="border border-gray-200 rounded-lg overflow-hidden bg-white">
          <div class="overflow-x-auto force-scrollbar max-h-[60vh]">
            <table class="w-full text-sm text-left">
              <thead class="bg-gray-50 sticky top-0 z-10">
                <tr class="border-b border-gray-200">
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Opération</th>
                  <th class="p-3 whitespace-nowrap font-medium text-gray-700">Activités</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="group in groupedByOperation" :key="group.operation">
                  <tr class="border-b border-gray-100">
                    <td class="p-3 align-top whitespace-nowrap">
                      <div class="flex items-center gap-2">
                        <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium" :class="badgeClasses(operationColor(group.operation))" x-text="operationLabel(group.operation)"></span>
                        <span class="text-gray-500 text-sm">(<span x-text="group.count"></span> activités)</span>
                      </div>
                    </td>
                    <td class="p-3">
                      <div class="space-y-2">
                        <template x-for="activity in group.activities" :key="activity.objectId">
                          <div class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg flex-wrap">
                            <span class="text-sm text-gray-500 whitespace-nowrap" x-text="formatDateTime(activity.timestamp)"></span>
                            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" :class="badgeClasses(typeColor(activity.type))" x-text="typeLabel(activity.type)"></span>
                            <span class="font-mono text-sm" x-text="activity.nfacture || '—'"></span>
                            <span x-show="activity.payeur_nom" class="text-sm truncate max-w-[150px]" x-text="activity.payeur_nom"></span>
                          </div>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
