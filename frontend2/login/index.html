<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Marki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/2/assets/css/shared.css">
  <script>
    Parse.initialize('adti-marki', 'c8d7e205725c6a06dfb3771a2f739fe861664fc6ef90fbda');
    Parse.serverURL = 'https://adti.markidiags.com/api/parse';
  </script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="app" x-data="loginPage" x-cloak>
    <div class="min-h-screen flex items-center justify-center">
      <div class="w-full max-w-md px-4">
        <div class="text-center mb-8">
          <img src="/2/assets/img/marki-logo.png" alt="Marki" class="h-12 w-auto mx-auto mb-3" />
          <p class="text-sm text-gray-500">Relances automatiques de factures impayées</p>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-base font-semibold text-gray-900">Connexion</h2>
          </div>
          <div class="p-6">
            <form class="space-y-4" @submit.prevent="handleSubmit">
              <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Identifiant</label>
                <input
                  id="username"
                  x-model="form.username"
                  type="text"
                  placeholder="Votre identifiant"
                  autocomplete="username"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                />
              </div>

              <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input
                  id="password"
                  x-model="form.password"
                  type="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                />
              </div>

              <div x-show="error" x-cloak class="rounded-md bg-red-50 border border-red-200 p-3 flex items-start gap-2">
                <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5 text-sm"></i>
                <p class="text-sm text-red-700" x-text="error"></p>
              </div>

              <button
                id="btn-submit"
                type="submit"
                class="w-full inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed"
                :disabled="loading"
              >
                <span x-show="loading" class="mr-2">
                  <i class="fa-solid fa-circle-notch fa-spin"></i>
                </span>
                <span>Se connecter</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
