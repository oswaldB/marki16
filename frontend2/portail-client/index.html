<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail client — Marki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/2/assets/css/shared.css">
  <script>
    Parse.initialize('adti-marki', 'c8d7e205725c6a06dfb3771a2f739fe861664fc6ef90fbda');
    Parse.serverURL = 'https://adti.markidiags.com/api/parse';
  </script>
</head>
<body class="bg-white text-gray-900">
  <div id="app" x-data="portailclientPage" x-cloak class="w-full h-screen flex flex-col">
    <!-- Logo -->
    <div class="px-4 py-2 border-b border-gray-100 flex items-center">
      <img src="/2/assets/img/marki-logo.png" alt="Marki" class="h-6 w-auto">
    </div>
    <!-- Header : visible seulement si pdfUrl valide et pas d'erreur -->
    <template x-if="pdfUrl && !erreur">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <a :href="pdfUrl" target="_blank" id="btn-telecharger">
            <button type="button" class="inline-flex items-center gap-2 rounded-md text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 px-3 py-2 transition-colors">
              <i class="fa-solid fa-arrow-down-to-line"></i>
              Télécharger
            </button>
          </a>
        </div>
      </div>
    </template>

    <!-- Contenu -->
    <div class="relative flex-1">
      <!-- Loading overlay -->
      <div x-show="loading && pdfUrl" x-cloak class="absolute inset-0 flex items-center justify-center bg-white/80 z-10">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-gray-400"></i>
      </div>

      <!-- Erreur -->
      <div x-show="erreur" x-cloak class="flex items-center justify-center h-full flex-col gap-4">
        <i class="fa-solid fa-circle-exclamation text-4xl text-red-500"></i>
        <p class="text-gray-600 text-center px-4" x-text="erreur"></p>
      </div>

      <!-- PDF iframe -->
      <template x-if="pdfUrl && !erreur">
        <iframe
          :src="pdfUrl"
          class="w-full h-full border-0"
          @load="loading = false"
          @error="erreur = 'Ce lien a expiré. Veuillez réutiliser le lien envoyé par email.'; loading = false"
        ></iframe>
      </template>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
