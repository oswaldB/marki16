<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factures à régler — Marki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/2/assets/css/shared.css">
  <script>
    Parse.initialize('adti-marki', 'c8d7e205725c6a06dfb3771a2f739fe861664fc6ef90fbda');
    Parse.serverURL = 'https://adti.markidiags.com/api/parse';
  </script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="app" x-data="portailmissionPage" x-cloak>
    <main class="min-h-screen p-4 md:p-6">
      <div class="max-w-4xl mx-auto">

        <!-- Header -->
        <div x-show="!erreur" class="mb-6">
          <div class="flex items-center gap-2 mb-2">
            <img src="/2/assets/img/marki-logo.png" alt="Marki" class="h-8 w-auto mr-2">
            <div class="p-2 bg-blue-100 rounded-lg">
              <i class="fa-solid fa-file-invoice text-blue-600 text-lg"></i>
            </div>
            <h1 class="text-xl font-semibold text-gray-900">Factures à régler</h1>
          </div>
          <p class="text-sm text-gray-500">Voici vos factures en attente de paiement.</p>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="flex items-center justify-center py-12">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-gray-400"></i>
        </div>

        <!-- Error -->
        <div x-show="erreur && !loading" class="w-full h-screen bg-white flex flex-col items-center justify-center p-4">
          <div class="text-center text-red-500">
            <i class="fa-solid fa-circle-exclamation text-4xl mb-4"></i>
            <h2 class="text-lg font-medium text-gray-900 mb-2">Erreur</h2>
            <p class="text-gray-600 mb-4" x-text="erreur"></p>
            <p class="text-sm text-gray-500">Veuillez réutiliser le lien reçu par email.</p>
          </div>
        </div>

        <!-- Content -->
        <div x-show="!loading && !erreur" class="space-y-6">

          <!-- Facture sélectionnée (si impayeId spécifié) -->
          <template x-if="currentImpaye">
            <div class="bg-white rounded-lg shadow-sm border border-blue-200 overflow-hidden">
              <div class="p-4 border-b border-blue-200 bg-blue-50">
                <h2 class="font-medium text-blue-700 flex items-center gap-2">
                  <i class="fa-solid fa-circle-info"></i>
                  Facture sélectionnée
                </h2>
              </div>
              <div class="p-4">
                <div x-html="renderCard(currentImpaye)"></div>
              </div>
            </div>
          </template>

          <!-- Tableau : Factures à régler -->
          <div x-show="impayesNonRegles.length > 0" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-red-50">
              <h2 class="font-medium text-red-700 flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                Factures à régler (<span x-text="impayesNonRegles.length"></span>)
              </h2>
            </div>
            <div class="divide-y divide-gray-200">
              <template x-for="impaye in impayesNonRegles" :key="impaye.id">
                <div class="p-4">
                  <div x-html="renderCard(impaye)"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- Message si aucune facture à régler -->
          <div x-show="impayesNonRegles.length === 0" class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 text-center">
            <i class="fa-solid fa-circle-check text-5xl text-green-500 mb-4"></i>
            <h2 class="text-lg font-medium text-gray-900 mb-2">Aucune facture à régler</h2>
            <p class="text-gray-500">Vous n'avez actuellement aucune facture en attente de paiement.</p>
          </div>

          <!-- Message si aucune facture du tout -->
          <div x-show="impayes.length === 0 && !currentImpaye" class="text-center py-12">
            <i class="fa-solid fa-file-invoice text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-500">Aucune facture trouvée pour votre compte.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
