<!-- Mockup: dashboard - empty -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ADTI (Empty)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <!-- Navigation -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-8">
        <div class="text-xl font-bold text-blue-600">ADTI</div>
        <div class="flex gap-6 text-sm">
          <a href="#" class="text-blue-600 font-medium">Dashboard</a>
          <a href="#" class="text-slate-600 hover:text-slate-900">Factures</a>
          <a href="#" class="text-slate-600 hover:text-slate-900">Clients</a>
          <a href="#" class="text-slate-600 hover:text-slate-900">Importer</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">+ Importer</button>
        <div class="w-8 h-8 bg-slate-300 rounded-full"></div>
      </div>
    </div>
  </nav>

  <!-- Empty State -->
  <main class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Tableau de bord</h1>
    
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
      <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Aucune donnée importée</h2>
      
      <p class="text-slate-600 mb-8 max-w-md mx-auto">
        Importez vos factures depuis un fichier CSV ou Excel pour commencer l'analyse de vos taux d'impayés.
      </p>
      
      <button class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium inline-flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
        </svg>
        Importer des factures
      </button>
    </div>
  </main>
</body>
</html>
