<!-- Mockup: dashboard - loading -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ADTI (Loading)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <!-- Navigation -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-8">
        <div class="text-xl font-bold text-blue-600">ADTI</div>
        <div class="flex gap-6 text-sm">
          <a href="#" class="text-blue-600 font-medium">Dashboard</a>
          <a href="#" class="text-slate-600">Factures</a>
          <a href="#" class="text-slate-600">Clients</a>
          <a href="#" class="text-slate-600">Importer</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg opacity-50">+ Importer</button>
        <div class="w-8 h-8 bg-slate-200 rounded-full animate-pulse"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content Skeleton -->
  <main class="max-w-7xl mx-auto p-6">
    <div class="h-8 w-48 bg-slate-200 rounded animate-pulse mb-6"></div>
    
    <!-- KPI Skeletons -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="h-4 w-24 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-8 w-20 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full w-full bg-slate-200 animate-pulse"></div>
        </div>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="h-4 w-20 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-8 w-16 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full w-full bg-slate-200 animate-pulse"></div>
        </div>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="h-4 w-28 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-8 w-24 bg-slate-200 rounded animate-pulse"></div>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="h-4 w-24 bg-slate-200 rounded animate-pulse mb-2"></div>
        <div class="h-8 w-12 bg-slate-200 rounded animate-pulse"></div>
      </div>
    </div>

    <!-- Charts Skeleton -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="h-6 w-48 bg-slate-200 rounded animate-pulse"></div>
          <div class="h-8 w-32 bg-slate-200 rounded animate-pulse"></div>
        </div>
        <div class="h-64 bg-slate-100 rounded-lg animate-pulse"></div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <div class="h-6 w-32 bg-slate-200 rounded animate-pulse mb-4"></div>
        <div class="space-y-4">
          <div class="h-12 bg-slate-100 rounded animate-pulse"></div>
          <div class="h-12 bg-slate-100 rounded animate-pulse"></div>
          <div class="h-12 bg-slate-100 rounded animate-pulse"></div>
          <div class="h-12 bg-slate-100 rounded animate-pulse"></div>
          <div class="h-12 bg-slate-100 rounded animate-pulse"></div>
        </div>
      </div>
    </div>

    <!-- Alerts Skeleton -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="h-6 w-48 bg-slate-200 rounded animate-pulse mb-4"></div>
      
      <div class="space-y-3">
        <div class="h-20 bg-slate-100 rounded-lg animate-pulse"></div>
        <div class="h-20 bg-slate-100 rounded-lg animate-pulse"></div>
      </div>
    </div>
  </main>
</body>
</html>
