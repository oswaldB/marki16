<!-- Mockup: global/modal-relance - nominal -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Relance - ADTI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900/50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">
  <!-- Modal -->
  <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-semibold text-slate-900">Envoyer une relance</h3>
      <button class="text-slate-400 hover:text-slate-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
      <p class="text-sm text-slate-700">
        <strong>Destinataire:</strong> SARL Dupont Construction (contact@dupont-construction.fr)
      </p>
      <p class="text-sm text-slate-600 mt-1">
        <strong>Montant dû:</strong> 24 800,00 € (3 factures)
      </p>
    </div>

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Objet</label>
        <input type="text" value="Relance factures impayées - SARL Dupont Construction" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
        <textarea rows="8" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm">Bonjour,

Nous constatons que les factures suivantes demeurent impayées :

• FACT-2024-045 du 15/01/2024 : 12 500,00 €
• FACT-2024-032 du 02/12/2023 : 8 200,00 €
• FACT-2024-018 du 15/11/2023 : 4 100,00 €

TOTAL DÛ : 24 800,00 €

Nous vous prions de bien vouloir régulariser la situation dans les plus brefs délais.

Cordialement,
Le service comptable</textarea>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="cc" class="w-4 h-4 text-blue-600 rounded">
        <label for="cc" class="text-sm text-slate-700">Mettre mon responsable en copie</label>
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <button class="px-4 py-2 text-slate-700 hover:text-slate-900">Annuler</button>
      <button class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium inline-flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
        Envoyer la relance
      </button>
    </div>
  </div>
</body>
</html>
